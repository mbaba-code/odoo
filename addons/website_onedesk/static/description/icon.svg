<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Fond blanc -->
  <rect width="256" height="256" fill="white"/>

  <!-- Gradient background -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="128" cy="128" r="120" fill="url(#grad)"/>

  <!-- House icon -->
  <g transform="translate(128, 128)">
    <!-- House shape -->
    <path d="M -40 20 L -40 50 L 40 50 L 40 20 L 0 -30 Z" fill="white" stroke="none"/>

    <!-- Door -->
    <rect x="-15" y="20" width="30" height="40" fill="#667eea" rx="3"/>

    <!-- Door handle -->
    <circle cx="10" cy="40" r="3" fill="white"/>

    <!-- Window 1 -->
    <rect x="-35" y="0" width="15" height="15" fill="#667eea" rx="2"/>
    <line x1="-27.5" y1="0" x2="-27.5" y2="15" stroke="white" stroke-width="1"/>
    <line x1="-35" y1="7.5" x2="-20" y2="7.5" stroke="white" stroke-width="1"/>

    <!-- Window 2 -->
    <rect x="20" y="0" width="15" height="15" fill="#667eea" rx="2"/>
    <line x1="27.5" y1="0" x2="27.5" y2="15" stroke="white" stroke-width="1"/>
    <line x1="20" y1="7.5" x2="35" y2="7.5" stroke="white" stroke-width="1"/>

    <!-- Roof peak -->
    <path d="M -50 20 L 0 -40 L 50 20" fill="none" stroke="white" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Text below -->
  <text x="128" y="220" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#764ba2">OneDesk</text>
</svg>

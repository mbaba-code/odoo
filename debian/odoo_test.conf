[options]

; Mot de passe super admin (nécessaire pour créer/supprimer DB)
admin_passwd = admin

; Connection base de données
db_host = False
db_port = False
db_user = odoo
db_password = False
db_filter = ^base1$

; Serveur HTTP
http_port = 8069
longpolling_port = 8072
http_interface = 0.0.0.0

; Domaine local autorisé
proxy_mode = False

; Chemin addons (si besoin, décommente)
; addons_path = /usr/lib/python3/dist-packages/odoo/addons,/home/odoo/custom_addons

; Activer les applications de productivité
default_productivity_apps = True

; Email SMTP local (MailHog / Mailcatcher)
smtp_server = localhost
smtp_port = 1025
smtp_ssl = False
smtp_user =
smtp_password =

; Logs
logfile = /var/log/odoo/odoo.log
log_level = info
